<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Career Advisor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; max-width: 900px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; margin-top: 0; }
        .upload-section { border: 2px dashed #ccc; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        button { background: #1a73e8; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #1557b0; }
        .result-area { margin-top: 30px; padding-top: 20px; border-top: 2px solid #eee; }
        .advice-box { background: #e8f0fe; padding: 20px; border-left: 6px solid #1a73e8; border-radius: 4px; line-height: 1.6; }
        .success-badge { color: #28a745; font-weight: bold; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Resume Data Extractor</h1>
        <p>Upload a PDF resume to extract data and get professional career advice.</p>

        <form action="/" method="post" enctype="multipart/form-data" class="upload-section">
            <input type="file" name="file" accept=".pdf" required><br><br>
            <button type="submit">Analyze Resume</button>
        </form>

        {% if success %}
        <div class="result-area">
            <span class="success-badge">✔ Analysis Complete & Saved to CSV</span>
            <h3>Hello, {{ name }}!</h3>
            <div class="advice-box">
                <strong>Career Advice:</strong><br>
                {{ advice }}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
